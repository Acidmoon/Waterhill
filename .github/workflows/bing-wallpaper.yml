name: Update Bing Daily Wallpaper

on:
  schedule:
    - cron: "0 0 * * *" # 每天北京时间 08:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Bing wallpaper
        run: |
          URL=$(curl -sf "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('https://www.bing.com'+d['images'][0]['url'])")
          curl -sfL "$URL" -o src/assets/images/bing-daily.jpg
          # 校验是有效 JPEG,否则不提交
          python3 -c "import os,pathlib; p=pathlib.Path('src/assets/images/bing-daily.jpg'); h=p.read_bytes(); assert h[:2]==b'\xff\xd8' and len(h)>50000, 'invalid image'" || (echo '图片无效,跳过本次更新' && exit 0)
          file src/assets/images/bing-daily.jpg
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/images/bing-daily.jpg
          if git diff --cached --quiet; then
            echo "壁纸无变化,跳过提交"
          else
            git commit -m "chore: 更新 Bing 每日壁纸"
            git push
          fi
