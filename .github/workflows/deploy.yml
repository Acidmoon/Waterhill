name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *" # 每天北京时间 08:15 自动刷新壁纸并部署

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch Bing wallpaper (UHD 3840x2160)
        run: |
          IMG="src/assets/images/bing-daily.jpg"

          META=$(curl -sf "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN" || echo "")
          URL=$(echo "$META" | python3 -c "import sys,json;d=json.load(sys.stdin);i=d['images'][0];print('https://www.bing.com'+i['urlbase']+'_UHD.jpg')" 2>/dev/null || true)
          if [ -n "$URL" ]; then
            curl -sfL "$URL" -o "$IMG" || true
          fi

          if [ ! -s "$IMG" ] || ! python3 -c "import sys; f=open('$IMG','rb'); sys.exit(0 if f.read(2)==b'\xff\xd8' else 1)"; then
            PLAIN=$(echo "$META" | python3 -c "import sys,json;print('https://www.bing.com'+json.load(sys.stdin)['images'][0]['url'])" 2>/dev/null || true)
            if [ -n "$PLAIN" ]; then
              curl -sfL "$PLAIN" -o "$IMG" || true
            fi
          fi

          # 完整解码校验，避免拿到半截/损坏的壁纸导致后续构建失败
          if ! node -e "const sharp=require('sharp'); sharp('$IMG').toBuffer().then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
            echo "Bing wallpaper is invalid; falling back to repository copy."
            git checkout -- "$IMG"
          fi

          python3 -c "import pathlib;h=pathlib.Path('$IMG').read_bytes();assert h[:2]==b'\xff\xd8' and len(h)>0,'bad image'"
          file "$IMG"
      - name: Build
        run: pnpm run build
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
