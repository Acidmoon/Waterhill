# 夜航船 - Minimal Mistakes 站点配置
# 部署到 GitHub Pages 后,把 url 改成你的真实地址(如 https://blog.example.com)

title: 夜航船
email:
description: >-
  我在夜航船里写下的随想——技术笔记、生活随笔,以及所有忽然冒出来的想法。
  (口述文章为主,AI 润色后发布)
minimal_mistakes_skin: default
search: true

url: "https://blog.example.com"
baseurl: ""
repository: "Acidmoon/night-boat"

# 构建设置
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:title/
paginate: 5
paginate_path: /page:num/
timezone: Asia/Shanghai
locale: zh-CN

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "Acidmoon"
  avatar : "/assets/images/diary-cover.webp"
  bio    : "口述文章为主 · 技术笔记与生活随笔"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Acidmoon"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Acidmoon"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      toc: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
